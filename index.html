<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PGN Analyzer</title>
<style>
:root{--bg:#161512;--fg:#d6d4cf;--mut:#8a8883;--card:#262421;--l:#ebecd0;--d:#779556;--bs:min(88vw,520px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.bw{display:flex;gap:6px}
#bar{width:18px;height:var(--bs);background:#333;border-radius:3px;position:relative;overflow:hidden}
#wh{position:absolute;bottom:0;left:0;right:0;height:50%;background:#eee;transition:height .3s}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:var(--bs);height:var(--bs);user-select:none;aspect-ratio:1/1}
.sq{display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.8);line-height:1;min-width:0;min-height:0;overflow:hidden;aspect-ratio:1/1}
.l{background:var(--l)}.d{background:var(--d)}
.last{box-shadow:inset 0 0 0 100px rgba(255,235,59,.4)}
.best{box-shadow:inset 0 0 0 4px #1e88e5}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}.pb{color:#111}
.panel{width:min(92vw,420px);display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:6px;padding:8px 10px}
#hdr{color:var(--mut);font-size:12px;margin-bottom:4px}
#eval{font-size:22px;font-weight:700}
.ln{padding:3px 0;border-top:1px solid #333}
.sc{display:inline-block;min-width:52px;background:#111;border-radius:3px;padding:1px 5px;text-align:center}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select{background:#3a3733;color:var(--fg);border:0;border-radius:4px;padding:6px 12px;font-size:15px;cursor:pointer}
#ml{max-height:200px;overflow:auto;line-height:1.9}
.n{color:var(--mut);margin:0 3px 0 6px}.m{padding:1px 4px;border-radius:3px;cursor:pointer}.m:hover{background:#3a3733}.cur{background:#1e88e5;color:#fff}
.row{display:flex;gap:6px;margin-top:6px}input{flex:1;min-width:0}
#meta,#bl{color:var(--mut);font-size:12px;line-height:1.5}
#bl b{color:var(--fg)}.bd{color:#ef5350}.ms{color:#ffb74d}.in{color:#fff176}
textarea{width:100%;box-sizing:border-box;height:90px;background:#111;color:var(--fg);border:1px solid #333;border-radius:4px;font:12px monospace}
#out{height:130px}
</style></head><body>
<div class="wrap">
  <div class="bw"><div id="bar"><div id="wh"></div></div><div id="board" class="board"></div></div>
  <div class="panel">
    <div class="card"><div id="eval">0.00</div><div id="hdr">Engine</div><div id="lines"></div></div>
    <div class="ctl">
      <button id="b0">⏮</button><button id="b1">◀</button><button id="b2">▶</button><button id="b3">⏭</button><button id="fl">⇅</button>
      <label><input type="checkbox" id="on" checked> Engine</label>
      <select id="mp"><option>1</option><option selected>2</option></select> lines
    </div>
    <div id="ml" class="card"></div>
    <textarea id="pgn" placeholder="Paste PGN here">1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6 5. O-O Be7 6. Re1 b5 7. Bb3 d6 8. c3 O-O</textarea>
    <div class="card"><b>Lichess import (evals=true)</b><div class="row"><input id="lich" placeholder="https://lichess.org/xxxxxxxx" style="flex:1;background:#111;color:var(--fg);border:1px solid #333;border-radius:4px;padding:6px;font:12px monospace"><button id="fetch">Fetch</button></div><div id="meta">Paste a Lichess game link, or paste any PGN below.</div></div>
    <div class="ctl"><button id="load">Load PGN</button><button id="cls">Classify blunders (5s each)</button></div>
    <div id="bl" class="card">No blunder analysis yet.</div>
    <div class="card"><b>Annotated PGN</b><div class="row"><button id="exp">Update preview</button><button id="dl">Download</button><button id="cp">Copy</button></div><textarea id="out" placeholder="Annotated PGN will appear here"></textarea></div>
  </div>
</div>
<script src="engine.js"></script>
<script>
const $ = id => document.getElementById(id);
const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const GL = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟\uFE0E' };
let fens = [START], sans = [], ucis = [], ply = 0, flip = false, worker = null, timer = 0, infos = [], best = '';
let tags = {}, evals = [null], nags = [''], cmts = [''], verdicts = [''], blunders = [], lichEvals = [null];
const sanEng = new Engine();

const sqs = u => [[u.charCodeAt(0) - 97, +u[1] - 1], [u.charCodeAt(2) - 97, +u[3] - 1]];
const fmt = s => Math.abs(s) > 99800 ? (s > 0 ? '#' : '-#') + Math.ceil((100000 - Math.abs(s)) / 2) : (s > 0 ? '+' : '') + (s / 100).toFixed(2);

function draw() {
  const g = [];
  fens[ply].split(' ')[0].split('/').forEach((row, i) => {
    const a = [];
    for (const c of row) if (c > '0' && c < '9') for (let k = 0; k < +c; k++) a.push(''); else a.push(c);
    g[7 - i] = a;
  });
  const hl = new Set(), bh = new Set();
  if (ply && ucis[ply - 1]) sqs(ucis[ply - 1]).forEach(([f, r]) => hl.add(r * 8 + f));
  if (best) sqs(best).forEach(([f, r]) => bh.add(r * 8 + f));
  let h = '';
  for (let i = 0; i < 64; i++) {
    const r = flip ? i >> 3 : 7 - (i >> 3), f = flip ? 7 - (i & 7) : i & 7, p = g[r][f], k = r * 8 + f;
    h += `<div class="sq ${(r + f) % 2 ? 'l' : 'd'} ${hl.has(k) ? 'last' : ''} ${bh.has(k) ? 'best' : ''}">${p ? `<span class="${p < 'a' ? 'pw' : 'pb'}">${GL[p.toLowerCase()]}</span>` : ''}</div>`;
  }
  $('board').innerHTML = h;
}

function moveList() {
  const first = fens[0].split(' ')[1] === 'w';
  let h = '';
  sans.forEach((s, i) => {
    const k = i + 1;
    if ((i % 2 === 0) === first) h += `<span class="n">${Math.floor((i + (first ? 0 : 1)) / 2) + 1}.</span>`;
    else if (i === 0) h += '<span class="n">1…</span>';
    const v = verdicts[k] || '';
    const cls = blunders.includes(k) ? (v.includes('positional') ? 'in' : v.includes('miss') ? 'ms' : 'bd') : '';
    h += `<span class="m ${k === ply ? 'cur' : ''} ${cls}" data-i="${k}">${s}</span> `;
    if (v) h += `<span style="color:var(--mut);font-size:11px">[${v}]</span> `;
  });
  $('ml').innerHTML = h || 'No moves';
}

function lines() {
  const side = fens[ply].split(' ')[1] === 'w' ? 1 : -1;
  let h = '';
  for (let k = 1; k <= +$('mp').value; k++) {
    const o = infos[k];
    if (!o) continue;
    let w = side === 1, num = Math.floor(ply / 2) + 1, t = '';
    sanEng.pvSan(o.pv).slice(0, 12).forEach((s, i) => {
      if (w) t += num + '. '; else if (i === 0) t += num + '… ';
      t += s + ' ';
      if (!w) num++;
      w = !w;
    });
    h += `<div class="ln"><b class="sc">${fmt(o.score * side)}</b> ${t}</div>`;
  }
  $('lines').innerHTML = h;
  const top = infos[1];
  if (top) {
    const sc = top.score * side;
    $('hdr').textContent = `Depth ${top.depth} · ${Math.round(top.nps / 1000)}k nps`;
    $('eval').textContent = fmt(sc);
    $('wh').style.height = (50 + 50 * (2 / (1 + Math.exp(-sc / 400)) - 1)) + '%';
  }
}

function analyze() {
  clearTimeout(timer);
  if (worker) { worker.terminate(); worker = null; }
  $('lines').innerHTML = ''; $('hdr').textContent = $('on').checked ? 'Thinking…' : 'Engine off';
  if (!$('on').checked) return;
  timer = setTimeout(() => {
    worker = new Worker('engine.js');
    worker.onmessage = e => {
      const d = e.data;
      if (d.done) { if (!infos[1]) $('hdr').textContent = 'No legal moves'; return; }
      infos[d.multipv] = d; best = infos[1].pv[0]; draw(); lines();
    };
    worker.postMessage({ fen: fens[ply], ms: 30000, depth: 40, multipv: +$('mp').value });
  }, 150);
}

function show(i) {
  ply = Math.max(0, Math.min(fens.length - 1, i));
  best = ''; infos = [];
  sanEng.setFen(fens[ply]);
  draw(); moveList(); analyze();
  const cur = document.querySelector('.cur'); if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function loadPgn(raw) {
  let t = raw !== undefined ? raw : $('pgn').value, fen = START;
  tags = {}; evals = [null]; nags = ['']; cmts = ['']; verdicts = ['']; blunders = []; lichEvals = [null];
  const hm = [...t.matchAll(/\[([A-Za-z0-9_]+)\s+"([^"]*)"\]/g)];
  hm.forEach(m => tags[m[1]] = m[2]);
  const fm = t.match(/\[FEN\s+"([^"]+)"\]/); if (fm) fen = fm[1];
  if (raw !== undefined) $('pgn').value = t;
  // Strip PGN header tags only: header lines look like [Key "value"] at line start.
  // The old /\\[[^\\]]*\\]\\s*/g also ate inline [%eval ...] / [%clk ...] comments,
  // leaving every eval null and forcing the no-server-evals local fallback path.
  t = t.replace(/^[ \t]*\[[A-Za-z0-9_]+\s+"[^"]*"\][ \t]*\r?$/gm, ' ');
  // tokenize: keep comments, NAGs, moves, results
  const toks = []; let i = 0;
  while (i < t.length) {
    const c = t[i];
    if (c === '{') { const j = t.indexOf('}', i); toks.push(t.slice(i, j < 0 ? t.length : j + 1)); i = j < 0 ? t.length : j + 1; }
    else if (c === ';') { let j = t.indexOf('\n', i); if (j < 0) j = t.length; toks.push('{' + t.slice(i + 1, j) + '}'); i = j; }
    else if (c === '(') { let d = 1, j = i + 1; while (j < t.length && d) { if (t[j] === '(') d++; else if (t[j] === ')') d--; j++; } i = j; }
    else if (/\s/.test(c)) i++;
    else if (c === '$') { const m = t.slice(i).match(/^\$\d+/); toks.push(m[0]); i += m[0].length; }
    else { const m = t.slice(i).match(/^[^\s{}();$]+/); toks.push(m[0]); i += m[0].length; }
  }
  const e = new Engine(fen);
  fens = [fen]; sans = []; ucis = [];
  let err = '', pendEval = null, pendClk = null, pendCmt = [], pendNag = '', firstMove = true;
  const pushMove = s => {
    const san = s.replace(/[!?]+$/, '');
    const m = e.moveFromSan(san);
    if (!m) { err = 'Stopped at unreadable move: ' + s; return false; }
    let full = e.san(m);
    const suf = (s.match(/[!?]+$/) || [''])[0]; if (suf && !full.endsWith(suf)) full += suf;
    sans.push(full); ucis.push(Engine.str(m));
    // eval extraction: prefer [%eval x] / [%eval #N] (mate) in pending comment
    let ev = pendEval;
    for (const c of pendCmt) { const em = c.match(/\[%eval\s+(?:#(-?\d+)|([+-]?\d+(?:\.\d+)?))(?:,(\d+))?\]/); if (em) { ev = em[1] !== undefined ? mateScore(+em[1]) : Math.round(+em[2] * 100); if (em[3] !== undefined && em[1] === undefined) ev = ev >= 0 ? 100000 - (+em[3]) * 2 : -100000 - (+em[3]) * 2; } const cm = c.match(/\[%clk\s+([^\]]+)\]/); if (cm) pendClk = cm[1]; }
    e.make(m); fens.push(e.fen());
    evals.push(ev); lichEvals.push(ev); nags.push(pendNag); cmts.push(pendCmt.filter(c => !/\[%(eval|clk)[^\]]*\]/.test(c)).join(' ').trim()); verdicts.push('');
    pendEval = null; pendClk = null; pendCmt = []; pendNag = '';
    return true;
  };
  for (const tok of toks) {
    if (/^(1-0|0-1|1\/2-1\/2|\*)$/.test(tok)) { tags.Result = tags.Result || tok; break; }
    else if (/^\d+\.(\.\.)?$/.test(tok)) continue;
    else if (/^\{.*\}$/s.test(tok)) {
      const inner = tok.slice(1, -1);
      const em = inner.match(/\[%eval\s+(?:#(-?\d+)|([+-]?\d+(?:\.\d+)?))(?:,(\d+))?\]/);
      let ev = null;
      if (em) { ev = em[1] !== undefined ? mateScore(+em[1]) : Math.round(+em[2] * 100); if (em[3] !== undefined && em[1] === undefined) ev = ev >= 0 ? 100000 - (+em[3]) * 2 : -100000 - (+em[3]) * 2; }
      const cm = inner.match(/\[%clk\s+([^\]]+)\]/);
      if (ev !== null && sans.length && (evals[sans.length] === null || evals[sans.length] === undefined) && pendEval === null) {
        // comment FOLLOWS the move it annotates (Lichess style: "e4 { [%eval 0.17] }") — attach to previous move.
        // Literate exports emit TWO comments ("{ text } { [%eval ...] }"); the text lands in pendCmt
        // first, so don't require it to be empty — flush it to the previous move as well.
        evals[sans.length] = ev; lichEvals[sans.length] = ev;
        if (cm) { /* clock ignored for now */ }
        const flush = pendCmt.filter(c => !/\[%(eval|clk)[^\]]*\]/.test(c)).join(' ').trim();
        if (flush) cmts[sans.length] = (cmts[sans.length] ? cmts[sans.length] + ' ' : '') + flush;
        pendCmt = [];
        const clean = inner.replace(/\[%(eval|clk)[^\]]*\]/g, '').trim();
        if (clean) cmts[sans.length] = (cmts[sans.length] ? cmts[sans.length] + ' ' : '') + clean;
      } else {
        pendCmt.push(inner);
        if (ev !== null) pendEval = ev;
      }
    }
    else if (/^\$\d+$/.test(tok)) pendNag = tok;
    else if (/^[!?]+$/.test(tok)) { if (sans.length || nags.length > 1) { const k = sans.length; nags[k] = (nags[k] || '') + tok; sans[k - 1] = (sans[k - 1] || '') + tok; } }
    else { firstMove = false; if (!pushMove(tok)) break; }
  }
  const hasEvals = !!evals.slice(1).find(v => v !== null && v !== undefined);
  // Check for Lichess blunder markers (?? or $4) in the parsed PGN
  const hasLichessBlunderMarkers = nags.some(n => n && n.includes('$4')) || 
    sans.some(s => /⁇|\?\?/.test(s));
  
  if (!hasLichessBlunderMarkers) {
    // No Lichess blunder markers: skip ALL local engine evaluation
    blunders = [];
    $('bl').textContent = 'No Lichess blunder markers (??, $4) found — local engine evaluation skipped.';
    meta(); renderBl(); moveList(); show(0);
  } else {
    // Has Lichess blunder markers: proceed with detection (and local scan if needed)
    if (!hasEvals && sans.length && !err) $('bl').textContent = 'No server evals — scanning locally (~0.4s/position, ?? markers still count)…';
    detectLocal().then(() => { meta(); renderBl(); moveList(); });
    meta(); show(0); if (hasEvals || !sans.length || err) renderBl();
  }
  if (err) $('hdr').textContent = err;
}

// blunder detection: trust Lichess server markers (?? / $4) only when server evals exist.
// Pasted PGNs without server evals fall back to a quick local scan (~400ms/pos, >=100cp drop).
// Mate scores ([%eval #N]) map to +/-99900 so "8.65 -> Mate in 6" no longer reads as null.
function mateScore(n) { return n > 0 ? 99900 : n < 0 ? -99900 : 0; }
function pov(ev, moverIsWhite) { // lichess evals are white-pov cp; convert to mover-pov
  if (ev === null || ev === undefined) return null;
  if (Math.abs(ev) > 90000) return ev > 0 ? (moverIsWhite ? 99900 : -99900) : (moverIsWhite ? -99900 : 99900);
  return moverIsWhite ? ev : -ev;
}
async function detectLocal() {
  blunders = [];
  const isLich = !!evals.slice(1).find(v => v !== null && v !== undefined);
  if (!isLich) { // no server evals: run quick local scan ~400ms/pos for eval drop
    for (let k = 1; k <= sans.length; k++) {
      const sc = await engScore(fens[k - 1], 400);
      evals[k] = sc; lichEvals[k] = null;
    }
  }
  for (let k = 1; k <= sans.length; k++) {
    const moverWhite = fens[k - 1].split(' ')[1] === 'w';
    const prev = pov(k === 1 ? (lichEvals[0] ?? evals[0] ?? 20) : evals[k - 1], moverWhite);
    const cur = pov(evals[k], moverWhite);
    const nagB = (nags[k] || '').includes('$4') || /⁇|\?\?/.test(sans[k - 1] || '');
    if (isLich) { if (nagB) blunders.push(k); continue; } // Lichess game: only ?? markers count
    let drop = (prev !== null && cur !== null) ? prev - cur : null;
    if (nagB || (drop !== null && drop >= 100)) blunders.push(k); // local game: ?? markers count, plus flat 100cp rule
  }
}
function engScore(fen, ms) {
  return new Promise(res => {
    const w = new Worker('engine.js'); let got = null;
    w.onmessage = ev => { if (!ev.data.done) got = ev.data; };
    w.postMessage({ fen, ms, depth: 30, multipv: 1 });
    setTimeout(() => { try { w.terminate(); } catch (_) {} res(got ? got.score * (fen.split(' ')[1] === 'w' ? 1 : -1) : null); }, ms + 60);
  });
}
function meta() {
  const w = tags.White || '?', b = tags.Black || '?', wr = tags.WhiteElo ? ` (${tags.WhiteElo})` : '', br = tags.BlackElo ? ` (${tags.BlackElo})` : '';
  const extra = [tags.Event, tags.Site && tags.Site.includes('lichess') ? 'lichess.org' : tags.Site, tags.Opening, tags.ECO, tags.Result].filter(Boolean).join(' · ');
  $('meta').textContent = `${w}${wr} vs ${b}${br}` + (extra ? ` — ${extra}` : '') + (blunders.length ? ` — ${blunders.length} blunder(s)` : '');
}

function renderBl() {
  if (!blunders.length) { const nEv = lichEvals.slice(1).filter(v => v !== null && v !== undefined).length; $('bl').innerHTML = sans.length ? `No blunders detected (need ?? markers or ≥100cp eval drop). <span style="color:var(--mut)">Parsed ${sans.length} moves, ${nEv} server evals.</span>` : 'No blunder analysis yet.'; return; }
  $('bl').innerHTML = '<b>Blunders:</b><br>' + blunders.map(k => {
    const mv = Math.floor((k - 1) / 2) + 1, w = fens[k - 1].split(' ')[1] === 'w';
    const v = verdicts[k] ? ` — <b>${verdicts[k]}</b>` : ' — <i>unclassified (press Classify)</i>';
    return `${mv}.${w ? '' : '..'} ${sans[k - 1]}${v}`;
  }).join('<br>');
}

// Task 5+6: for each Lichess blunder, run material engine 5s on pre+post positions.
// If material swing >=100cp (mover-pov) => material; then missed win vs allowed loss:
//   bestPre (mover) vs actual post (mover-pov): if bestPre - postAfter >= 100 => allowed loss? refine:
//   - missed win: pre-move best line already winning (>=+200 mover) and played move throws it (post <= +50)
//   - material loss: post-move opponent best reply wins material (oppPV score high)
// Simplified deterministic rule using material engine scores (both White-POV via engFull):
//   S0 = engine(fens[k-1]) mover-pov, S1 = engine(fens[k]) mover-pov (opp reply baked into search)
//   If S0 - S1 >=100 => material.
//     if S0 >=150 and S1 <=50 => "simple material miss" (had win, missed it)
//     else => "simple material loss" (allowed opponent win)
//   else => "positional"
async function classify() {
  if (!blunders.length) { 
    const hasMarkers = nags.some(n => n && n.includes('$4')) || sans.some(s => /⁇|\?\?/.test(s));
    $('bl').textContent = hasMarkers 
      ? 'No blunders detected. Load a Lichess game first.' 
      : 'No Lichess blunder markers (??, $4) found — classification skipped.';
    return; 
  }
  $('bl').textContent = 'Classifying with material engine (5s × 2 per blunder)…';
  for (const k of blunders) {
    const moverWhite = fens[k - 1].split(' ')[1] === 'w';
    const sgn = moverWhite ? 1 : -1;
    const r0 = await engFull(fens[k - 1], 5000), r1 = await engFull(fens[k], 5000);
    // engFull returns White-POV, so × sgn converts to mover-POV. No extra negation:
    // post-move search already includes the opponent's best reply.
    const S0 = r0 ? r0.score * sgn : null, S1 = r1 ? r1.score * sgn : null;
    let v = 'positional';
    if (S0 !== null && S1 !== null && (S0 - S1) >= 100) {
      v = (S0 >= 150 && S1 <= 50) ? 'simple material miss' : 'simple material loss';
    }
    verdicts[k] = v;
    // append comment for export: "blunder — <verdict>"
    const tag = `blunder — ${v}`;
    cmts[k] = cmts[k] ? cmts[k] + ' ' + tag : tag;
    renderBl(); moveList();
  }
  $('bl').innerHTML += '<br>Done. Use “Update preview” to refresh annotated PGN.';
}
function engFull(fen, ms) {
  return new Promise(res => {
    const w = new Worker('engine.js'); let infos = [];
    w.onmessage = ev => { if (!ev.data.done) infos[ev.data.multipv] = ev.data; };
    w.postMessage({ fen, ms, depth: 60, multipv: 1 });
    setTimeout(() => { try { w.terminate(); } catch (_) {} const o = infos[1]; res(o ? { score: o.score * (fen.split(' ')[1] === 'w' ? 1 : -1), pv: o.pv } : null); }, ms + 80);
  });
}

function buildPgn() {
  let h = '';
  const order = ['Event', 'Site', 'Date', 'Round', 'White', 'Black', 'Result', 'ECO', 'Opening', 'WhiteElo', 'BlackElo', 'TimeControl', 'Termination'];
  for (const k of order) if (tags[k]) h += `[${k} "${tags[k]}"]\n`;
  for (const k of Object.keys(tags)) if (!order.includes(k) && k !== 'FEN') h += `[${k} "${tags[k]}"]\n`;
  if (fens[0] !== START) h += `[FEN "${fens[0]}"]\n`;
  h += '\n';
  const first = fens[0].split(' ')[1] === 'w';
  let num = 1, wtm = first;
  sans.forEach((s, i) => {
    const k = i + 1;
    if (wtm) h += num + '. ';
    else if (i === 0) h += num + '... ';
    h += s + ' ';
    if (nags[k] && !/\?\?|⁇/.test(s)) h += nags[k] + ' ';
    const bits = [];
    if (lichEvals[k] !== null && lichEvals[k] !== undefined) {
      const e = lichEvals[k];
      bits.push(Math.abs(e) > 90000 ? `[#${e > 0 ? '+' : '-'}]` : `[%eval ${(e / 100).toFixed(2)}]`);
    }
    if (cmts[k]) bits.push(cmts[k]);
    if (verdicts[k]) bits.push(`blunder — ${verdicts[k]}`);
    // dedupe verdict if already in cmts
    let cmt = bits.filter((v, ix) => bits.indexOf(v) === ix).join(' ').replace(/blunder — .*?blunder — /g, 'blunder — ');
    // strip dup verdict
    if (verdicts[k] && (cmt.match(new RegExp('blunder — ' + verdicts[k], 'g')) || []).length > 1)
      cmt = cmt.replace(new RegExp(' \\{?blunder — ' + verdicts[k] + '\\}?$'), '');
    if (bits.length) h += '{ ' + bits.join(' ').replace(/[{}]/g, '') + ' } ';
    if (!wtm) num++;
    wtm = !wtm;
  });
  h += (tags.Result || '*') + '\n';
  return h;
}

async function fetchLich() {
  const v = $('lich').value.trim();
  const m = v.match(/(?:lichess\.org\/)([A-Za-z0-9]{8})(?:\/\w+\/?)?/);
  const id = m ? m[1] : (v.match(/^[A-Za-z0-9]{8}$/) ? v : null);
  if (!id) { $('meta').textContent = 'Paste a valid Lichess URL like https://lichess.org/abcdef12'; return; }
  $('meta').textContent = 'Fetching from Lichess…';
  try {
    const url = `https://lichess.org/game/export/${id}?moves=1&tags=1&clocks=1&evals=1&opening=1&literate=1`;
    const r = await fetch(url, { headers: { Accept: 'application/x-chess-pgn' } });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' — game may be private or missing evals');
    const pgn = await r.text();
    loadPgn(pgn);
    $('meta').textContent += ' · imported with evals=true';
  } catch (err) { $('meta').textContent = 'Fetch failed: ' + err.message + ' (tip: paste the PGN manually — Lichess → Share → Export PGN with evals).'; }
}

$('load').onclick = () => loadPgn();
$('fetch').onclick = fetchLich;
$('cls').onclick = classify;
$('exp').onclick = () => { $('out').value = buildPgn(); };
$('dl').onclick = () => { const b = new Blob([$('out').value || buildPgn()], { type: 'application/x-chess-pgn' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'annotated.pgn'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
$('cp').onclick = async () => { $('out').value = $('out').value || buildPgn(); try { await navigator.clipboard.writeText($('out').value); $('hdr').textContent = 'Annotated PGN copied'; } catch (_) { $('out').select(); document.execCommand('copy'); } };
$('b0').onclick = () => show(0); $('b1').onclick = () => show(ply - 1);
$('b2').onclick = () => show(ply + 1); $('b3').onclick = () => show(fens.length - 1);
$('fl').onclick = () => { flip = !flip; draw(); };
$('on').onchange = () => show(ply); $('mp').onchange = () => show(ply);
$('ml').onclick = e => { if (e.target.dataset.i) show(+e.target.dataset.i); };
document.onkeydown = e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') show(ply - 1); else if (e.key === 'ArrowRight') show(ply + 1);
  else if (e.key === 'Home') show(0); else if (e.key === 'End') show(fens.length - 1);
  else if (e.key === 'f') { flip = !flip; draw(); }
};
loadPgn();
</script></body></html>

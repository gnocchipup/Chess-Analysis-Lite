<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PGN Analyzer</title>
<style>
:root{--bg:#161512;--fg:#d6d4cf;--mut:#8a8883;--card:#262421;--l:#ebecd0;--d:#779556;--bs:min(88vw,520px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.bw{display:flex;gap:6px}
#bar{width:18px;height:var(--bs);background:#333;border-radius:3px;position:relative;overflow:hidden}
#wh{position:absolute;bottom:0;left:0;right:0;height:50%;background:#eee;transition:height .3s}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:var(--bs);height:var(--bs);user-select:none}
.sq{display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.8);line-height:1}
.l{background:var(--l)}.d{background:var(--d)}
.last{box-shadow:inset 0 0 0 100px rgba(255,235,59,.4)}
.best{box-shadow:inset 0 0 0 4px #1e88e5}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}.pb{color:#111}
.panel{width:min(92vw,420px);display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:6px;padding:8px 10px}
#hdr{color:var(--mut);font-size:12px;margin-bottom:4px}
#eval{font-size:22px;font-weight:700}
.ln{padding:3px 0;border-top:1px solid #333}
.sc{display:inline-block;min-width:52px;background:#111;border-radius:3px;padding:1px 5px;text-align:center}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select{background:#3a3733;color:var(--fg);border:0;border-radius:4px;padding:6px 12px;font-size:15px;cursor:pointer}
#ml{max-height:200px;overflow:auto;line-height:1.9}
.n{color:var(--mut);margin:0 3px 0 6px}.m{padding:1px 4px;border-radius:3px;cursor:pointer}.m:hover{background:#3a3733}.cur{background:#1e88e5;color:#fff}
textarea{width:100%;box-sizing:border-box;height:90px;background:#111;color:var(--fg);border:1px solid #333;border-radius:4px;font:12px monospace}
</style></head><body>
<div class="wrap">
  <div class="bw"><div id="bar"><div id="wh"></div></div><div id="board" class="board"></div></div>
  <div class="panel">
    <div class="card"><div id="eval">0.00</div><div id="hdr">Engine</div><div id="lines"></div></div>
    <div class="ctl">
      <button id="b0">⏮</button><button id="b1">◀</button><button id="b2">▶</button><button id="b3">⏭</button><button id="fl">⇅</button>
      <label><input type="checkbox" id="on" checked> Engine</label>
      <select id="mp"><option>1</option><option selected>2</option></select> lines
    </div>
    <div id="ml" class="card"></div>
    <textarea id="pgn" placeholder="Paste PGN here">1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6 5. O-O Be7 6. Re1 b5 7. Bb3 d6 8. c3 O-O</textarea>
    <div class="ctl"><button id="load">Load PGN</button></div>
  </div>
</div>
<script src="engine.js"></script>
<script>
const $ = id => document.getElementById(id);
const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const GL = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟\uFE0E' };
let fens = [START], sans = [], ucis = [], ply = 0, flip = false, worker = null, timer = 0, infos = [], best = '';
const sanEng = new Engine();

const sqs = u => [[u.charCodeAt(0) - 97, +u[1] - 1], [u.charCodeAt(2) - 97, +u[3] - 1]];
const fmt = s => Math.abs(s) > 99800 ? (s > 0 ? '#' : '-#') + Math.ceil((100000 - Math.abs(s)) / 2) : (s > 0 ? '+' : '') + (s / 100).toFixed(2);

function draw() {
  const g = [];
  fens[ply].split(' ')[0].split('/').forEach((row, i) => {
    const a = [];
    for (const c of row) if (c > '0' && c < '9') for (let k = 0; k < +c; k++) a.push(''); else a.push(c);
    g[7 - i] = a;
  });
  const hl = new Set(), bh = new Set();
  if (ply && ucis[ply - 1]) sqs(ucis[ply - 1]).forEach(([f, r]) => hl.add(r * 8 + f));
  if (best) sqs(best).forEach(([f, r]) => bh.add(r * 8 + f));
  let h = '';
  for (let i = 0; i < 64; i++) {
    const r = flip ? i >> 3 : 7 - (i >> 3), f = flip ? 7 - (i & 7) : i & 7, p = g[r][f], k = r * 8 + f;
    h += `<div class="sq ${(r + f) % 2 ? 'l' : 'd'} ${hl.has(k) ? 'last' : ''} ${bh.has(k) ? 'best' : ''}">${p ? `<span class="${p < 'a' ? 'pw' : 'pb'}">${GL[p.toLowerCase()]}</span>` : ''}</div>`;
  }
  $('board').innerHTML = h;
}

function moveList() {
  const first = fens[0].split(' ')[1] === 'w';
  let h = '';
  sans.forEach((s, i) => {
    if ((i % 2 === 0) === first) h += `<span class="n">${Math.floor((i + (first ? 0 : 1)) / 2) + 1}.</span>`;
    else if (i === 0) h += '<span class="n">1…</span>';
    h += `<span class="m ${i + 1 === ply ? 'cur' : ''}" data-i="${i + 1}">${s}</span> `;
  });
  $('ml').innerHTML = h || 'No moves';
}

function lines() {
  const side = fens[ply].split(' ')[1] === 'w' ? 1 : -1;
  let h = '';
  for (let k = 1; k <= +$('mp').value; k++) {
    const o = infos[k];
    if (!o) continue;
    let w = side === 1, num = Math.floor(ply / 2) + 1, t = '';
    sanEng.pvSan(o.pv).slice(0, 12).forEach((s, i) => {
      if (w) t += num + '. '; else if (i === 0) t += num + '… ';
      t += s + ' ';
      if (!w) num++;
      w = !w;
    });
    h += `<div class="ln"><b class="sc">${fmt(o.score * side)}</b> ${t}</div>`;
  }
  $('lines').innerHTML = h;
  const top = infos[1];
  if (top) {
    const sc = top.score * side;
    $('hdr').textContent = `Depth ${top.depth} · ${Math.round(top.nps / 1000)}k nps`;
    $('eval').textContent = fmt(sc);
    $('wh').style.height = (50 + 50 * (2 / (1 + Math.exp(-sc / 400)) - 1)) + '%';
  }
}

function analyze() {
  clearTimeout(timer);
  if (worker) { worker.terminate(); worker = null; }
  $('lines').innerHTML = ''; $('hdr').textContent = $('on').checked ? 'Thinking…' : 'Engine off';
  if (!$('on').checked) return;
  timer = setTimeout(() => {
    worker = new Worker('engine.js');
    worker.onmessage = e => {
      const d = e.data;
      if (d.done) { if (!infos[1]) $('hdr').textContent = 'No legal moves'; return; }
      infos[d.multipv] = d; best = infos[1].pv[0]; draw(); lines();
    };
    worker.postMessage({ fen: fens[ply], ms: 30000, depth: 40, multipv: +$('mp').value });
  }, 150);
}

function show(i) {
  ply = Math.max(0, Math.min(fens.length - 1, i));
  best = ''; infos = [];
  sanEng.setFen(fens[ply]);
  draw(); moveList(); analyze();
  const cur = document.querySelector('.cur'); if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function loadPgn() {
  let t = $('pgn').value, fen = START;
  const fm = t.match(/\[FEN\s+"([^"]+)"\]/); if (fm) fen = fm[1];
  t = t.replace(/\[[^\]]*\]/g, ' ').replace(/\{[^}]*\}/g, ' ').replace(/;[^\n]*/g, ' ');
  while (/\([^()]*\)/.test(t)) t = t.replace(/\([^()]*\)/g, ' ');
  const toks = t.replace(/\$\d+/g, ' ').replace(/\d+\.(\.\.)?/g, ' ').split(/\s+/)
    .map(s => s.replace(/[!?]+$/, '')).filter(s => s && !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(s));
  const e = new Engine(fen);
  fens = [fen]; sans = []; ucis = [];
  let err = '';
  for (const s of toks) {
    const m = e.moveFromSan(s);
    if (!m) { err = 'Stopped at unreadable move: ' + s; break; }
    sans.push(e.san(m)); ucis.push(Engine.str(m)); e.make(m); fens.push(e.fen());
  }
  show(0);
  if (err) $('hdr').textContent = err;
}

$('load').onclick = loadPgn;
$('b0').onclick = () => show(0); $('b1').onclick = () => show(ply - 1);
$('b2').onclick = () => show(ply + 1); $('b3').onclick = () => show(fens.length - 1);
$('fl').onclick = () => { flip = !flip; draw(); };
$('on').onchange = () => show(ply); $('mp').onchange = () => show(ply);
$('ml').onclick = e => { if (e.target.dataset.i) show(+e.target.dataset.i); };
document.onkeydown = e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') show(ply - 1); else if (e.key === 'ArrowRight') show(ply + 1);
  else if (e.key === 'Home') show(0); else if (e.key === 'End') show(fens.length - 1);
  else if (e.key === 'f') { flip = !flip; draw(); }
};
loadPgn();
</script></body></html>
